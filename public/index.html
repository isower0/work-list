<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Work v2</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <small>DAILY WORK v2</small>
      <h1>บันทึกงานประจำวัน</h1>
      <p>แสดงงานทั้งหมด • Filter ตามวันที่สร้างและสถานะ</p>
    </div>
    <a href="/api/backup">สำรองข้อมูล</a>
  </header>

  <section class="filters">
    <label>จาก<input id="from" type="date"></label>
    <label>ถึง<input id="to" type="date"></label>
    <label>สถานะ (เลือกได้หลายอัน)
      <div id="fs" class="pills">
        <button type="button" class="pill-btn todo" data-status="todo">ยังไม่ได้ทำ</button>
        <button type="button" class="pill-btn doing" data-status="doing">กำลังทำ</button>
        <button type="button" class="pill-btn testing" data-status="testing">กำลังทดสอบ</button>
        <button type="button" class="pill-btn done" data-status="done">เสร็จแล้ว</button>
      </div>
    </label>
    <button id="clear" class="gray">ล้าง Filter</button>
  </section>

  <section id="sum" class="summary"></section>

  <form id="form">
    <input id="name" placeholder="ชื่องาน" required>
    <input id="detail" placeholder="รายละเอียดเพิ่มเติม">
    <select id="status">
      <option value="todo">ยังไม่ได้ทำ</option>
      <option value="doing">กำลังทำ</option>
      <option value="testing">กำลังทดสอบ</option>
      <option value="done">เสร็จแล้ว</option>
    </select>
    <button>+ เพิ่มงาน</button>
  </form>

  <div id="bulk" class="bulk hidden">
    <span>เลือกไว้ <b id="bulkCount">0</b> รายการ</span>
    <button id="bulkDel" class="del">ลบรายการที่เลือก</button>
    <button id="bulkClear" class="gray">ยกเลิกเลือก</button>
  </div>

  <section class="panel">
    <div class="head">
      <label class="head-left">
        <input type="checkbox" id="selAll" class="chk">
        <b>รายการงานทั้งหมด</b>
      </label>
      <span id="total"></span>
    </div>
    <div id="tasks"></div>
  </section>
</main>

<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h3>แก้ไขงาน</h3>
    <label>ชื่องาน<input id="eName" placeholder="ชื่องาน"></label>
    <label>รายละเอียด<textarea id="eDetail" placeholder="รายละเอียด"></textarea></label>
    <div class="modal-actions">
      <button id="eCancel" class="gray" type="button">ยกเลิก</button>
      <button id="eSave" type="button">บันทึก</button>
    </div>
  </div>
</div>

<div id="dialog" class="modal hidden">
  <div class="modal-content dialog-content">
    <h3 id="dTitle"></h3>
    <p id="dMsg"></p>
    <div class="modal-actions">
      <button id="dCancel" class="gray" type="button">ยกเลิก</button>
      <button id="dOk" type="button">ตกลง</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
