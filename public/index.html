<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Work v2</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>DAILY WORK v2</small><h1>บันทึกงานประจำวัน</h1><p>แสดงงานทั้งหมด • Filter ตามวันที่สร้างและสถานะ</p></div><a href="/api/backup">สำรองข้อมูล</a></header><section class="filters"><label>จาก<input id="from" type="date"></label><label>ถึง<input id="to" type="date"></label><label>สถานะ<select id="fs"><option value="">ทุกสถานะ</option><option value="todo">ยังไม่ได้ทำ</option><option value="doing">กำลังทำ</option><option value="testing">กำลังทดสอบ</option><option value="done">เสร็จแล้ว</option></select></label><button id="clear" class="gray">ล้าง Filter</button></section><section id="sum" class="summary"></section><form id="form"><input id="name" placeholder="ชื่องาน" required><input id="detail" placeholder="รายละเอียดเพิ่มเติม"><select id="status"><option value="todo">ยังไม่ได้ทำ</option><option value="doing">กำลังทำ</option><option value="testing">กำลังทดสอบ</option><option value="done">เสร็จแล้ว</option></select><button>+ เพิ่มงาน</button></form><section class="panel"><div class="head"><b>รายการงานทั้งหมด</b><span id="total"></span></div><div id="tasks"></div></section></main><script src="/app.js"></script></body></html>
